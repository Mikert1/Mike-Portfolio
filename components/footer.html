<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mikert.com | Footer component</title>
</head>
<!-- The document wrapper below matters, even though only its contents get
     used. Dev servers that inject a live-reload script (VS Code's Live Server
     among them) look for the closing body tag to inject in front of; handed a
     bare fragment some of them mangle or truncate the response, and a long
     file loses its tail. componium reads this document's body, so keep it. -->
<body>
<footer class="siteFooter">
    <div class="footerInner">
        <div class="footerTop">
            <div class="d-f fd-c g-6px">
                <p class="footerHeading">Pages</p>
                <a href="/" class="footerLink">Home</a>
                <a href="/brand/" class="footerLink">Brand Assets</a>
            </div>
            <div class="d-f fd-c g-6px">
                <p class="footerHeading">Projects</p>
                <a href="/projects/?group=solo" class="footerLink">My own</a>
                <a href="/projects/?group=school" class="footerLink">School &amp; work</a>
            </div>
            <div class="d-f fd-c g-6px">
                <p class="footerHeading">Skills</p>
                <a href="/#languages-section" class="footerLink">Languages</a>
                <a href="/#programs-section" class="footerLink">Programs</a>
            </div>
            <div class="d-f fd-c g-10px">
                <p class="footerHeading">Contact</p>
                <a href="mailto:mike@softium.nl" class="footerLink d-f ai-c g-8px">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z"/>
                    </svg>
                    mike@softium.nl
                </a>
            </div>
        </div>
        <div class="footerDivider"></div>
        <div class="footerBottom">
            <p class="berylium font-1.4rem">Mike Balvert</p>
            <p class="textMuted font-0.85rem">Copyright &copy; 2026 Mikert</p>
        </div>
    </div>
</footer>
</body>
</html>
