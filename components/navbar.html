<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mikert.com | Navbar component</title>
</head>
<!-- The document wrapper below matters, even though only its contents get
     used. Dev servers that inject a live-reload script (VS Code's Live Server
     among them) look for the closing body tag to inject in front of; handed a
     bare fragment some of them mangle or truncate the response, and a long
     file loses its tail. componium reads this document's body, so keep it. -->
<body>
<nav class="d-f ai-c jc-sb h-50px">
    <a href="/" class="navBrand d-f ai-c h-30px berylium font-2rem font-1.4rem_500">
        <p class="m-0">Mike Balvert</p>
    </a>

    <div class="d-f ai-c g-25px h-100%">
        <!-- Both menus point at sections of the homepage, so the links are
             absolute (/#id): they work the same from /project/ or /brand/. -->
        <div class="dropdown">
            <input type="checkbox" id="projects-dropdown" class="dropdownCheckbox">
            <label for="projects-dropdown" class="dropdownBtn d-f d-n_700px ai-c jc-c g-5px">
                <p class="m-0">Projects</p>
                <svg class="pointerSvg h-15px w-15px" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/>
                </svg>
            </label>
            <div class="dropdownContainer">
                <div class="dropdownContent">
                    <a class="d-f ai-c jc-s g-10px" href="/#masterpiece-project">
                        <svg class="dropdownIcon accentHue h-28px w-28px" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.314.16-.888-.282-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.612.636-.283.95l3.523 3.356-.83 4.73zm4.905-2.767-3.686 1.894.694-3.957a.56.56 0 0 0-.163-.505L1.71 6.745l4.052-.576a.53.53 0 0 0 .393-.288L8 2.223l1.847 3.658a.53.53 0 0 0 .393.288l4.052.575-2.906 2.77a.56.56 0 0 0-.163.506l.694 3.957-3.686-1.894a.5.5 0 0 0-.461 0z"/>
                        </svg>
                        <div class="d-f fd-c jc-c">
                            <p class="m-0">Masterpiece</p>
                            <p class="m-0 font-0.8rem textMuted">Planium — the one I am proudest of</p>
                        </div>
                    </a>
                    <hr class="dropdownDivider">
                    <a class="d-f ai-c jc-s g-10px" href="/#my-own-projects">
                        <svg class="dropdownIcon accentHue h-28px w-28px" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M8.646 5.646a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1 0 .708l-2 2a.5.5 0 0 1-.708-.708L10.293 8 8.646 6.354a.5.5 0 0 1 0-.708m-1.292 0a.5.5 0 0 0-.708 0l-2 2a.5.5 0 0 0 0 .708l2 2a.5.5 0 0 0 .708-.708L5.707 8l1.647-1.646a.5.5 0 0 0 0-.708"/>
                            <path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/>
                            <path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/>
                        </svg>
                        <div class="d-f fd-c jc-c">
                            <p class="m-0">My own</p>
                            <p class="m-0 font-0.8rem textMuted">Projects I build in my own time</p>
                        </div>
                    </a>
                    <hr class="dropdownDivider">
                    <a class="d-f ai-c jc-s g-10px" href="/#school-projects">
                        <svg class="dropdownIcon accentHue h-28px w-28px" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917zM8 8.46 1.758 5.965 8 3.052l6.242 2.913z"/>
                            <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466zm-.068 1.873.22-.748 3.496 1.311a.5.5 0 0 0 .352 0l3.496-1.311.22.748L8 12.46z"/>
                        </svg>
                        <div class="d-f fd-c jc-c">
                            <p class="m-0">School &amp; work</p>
                            <p class="m-0 font-0.8rem textMuted">Built for my study or for a client</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <div class="dropdown">
            <input type="checkbox" id="skills-dropdown" class="dropdownCheckbox">
            <label for="skills-dropdown" class="dropdownBtn d-f d-n_700px ai-c jc-c g-5px">
                <p class="m-0">Skills</p>
                <svg class="pointerSvg h-15px w-15px" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/>
                </svg>
            </label>
            <div class="dropdownContainer">
                <div class="dropdownContent">
                    <a class="d-f ai-c jc-s g-10px" href="/#languages-section">
                        <svg class="dropdownIcon accentHue h-28px w-28px" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M5.854 4.854a.5.5 0 1 0-.708-.708l-3.5 3.5a.5.5 0 0 0 0 .708l3.5 3.5a.5.5 0 0 0 .708-.708L2.707 8zm4.292 0a.5.5 0 0 1 .708-.708l3.5 3.5a.5.5 0 0 1 0 .708l-3.5 3.5a.5.5 0 0 1-.708-.708L13.293 8z"/>
                        </svg>
                        <div class="d-f fd-c jc-c">
                            <p class="m-0">Languages</p>
                            <p class="m-0 font-0.8rem textMuted">The languages I know and use</p>
                        </div>
                    </a>
                    <hr class="dropdownDivider">
                    <a class="d-f ai-c jc-s g-10px" href="/#programs-section">
                        <svg class="dropdownIcon accentHue h-28px w-28px" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M6 9a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3A.5.5 0 0 1 6 9M3.854 4.146a.5.5 0 1 0-.708.708L4.793 6.5 3.146 8.146a.5.5 0 1 0 .708.708l2-2a.5.5 0 0 0 0-.708z"/>
                            <path d="M2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/>
                        </svg>
                        <div class="d-f fd-c jc-c">
                            <p class="m-0">Programs</p>
                            <p class="m-0 font-0.8rem textMuted">What I work in every day</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Mobile: the two dropdowns above are hidden and everything folds
             into this one menu instead. -->
        <div class="d-n d-b_700px h-100% pos-r">
            <input type="checkbox" id="hamburger-toggle" class="dropdownCheckbox">
            <label for="hamburger-toggle" class="d-f ai-c jc-c h-100%">
                <svg class="h-24px w-24px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                </svg>
            </label>

            <div class="hamburgerMenu">
                <a href="/">Home</a>
                <p class="hamburgerHeading m-0">Projects</p>
                <a href="/#my-own-projects" class="textMuted ml-10px">My own</a>
                <a href="/#school-projects" class="textMuted ml-10px">School &amp; work</a>
                <p class="hamburgerHeading m-0">Skills</p>
                <a href="/#languages-section" class="textMuted ml-10px">Languages</a>
                <a href="/#programs-section" class="textMuted ml-10px">Programs</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
